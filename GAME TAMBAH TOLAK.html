    <style>

        .mission-clock-icon {
            width: 1.05em;
            height: 1.05em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: 0 0 auto;
        }

        .mission-timer {
            color: #67E8F9;
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.28);

        }

        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4, .font-display {
            font-family: 'Fredoka', sans-serif;
        }
        .pop-animation {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {

            40%, 80% { transform: translateX(8px); }

        .strike-red {
            position: relative;
            display: inline-block;
        }
        .strike-red::after {
            content: "";

            top: 50%;

            transform: translate(-50%, -50%) rotate(-15deg);
        }

        .patch-box-top-styled {
            background-color: transparent !important;
            border: 2px solid #38bdf8 !important;
            color: #fbbf24 !important;
            width: 1.5rem !important;
            height: 1.5rem !important;
            font-size: 0.7rem !important;
            margin: 0 auto !important;
        }

        .patch-box-bottom-styled {
            background-color: #3b0764 !important;
            border: 2px solid #eab308 !important;
            color: #ffffff !important;
        }

        .keypad-num-btn {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            border: 1px solid #60a5fa;
            border-bottom-width: 3px;
            border-bottom-color: #1e40af;
            box-shadow: 0 3px 5px -1px rgba(0, 0, 0, 0.25);
            transition: transform 0.08s ease, filter 0.08s ease;
        }
        .keypad-num-btn:hover {
            filter: brightness(1.1);
        }
        .keypad-num-btn:active, .keypad-num-btn.pressed {
            transform: translateY(2px) scale(0.96);
            border-bottom-width: 1px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .keypad-del-btn {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            border: 1px solid #f87171;
            border-bottom-width: 3px;
            border-bottom-color: #991b1b;
            box-shadow: 0 3px 5px -1px rgba(0, 0, 0, 0.25);
            transition: transform 0.08s ease, filter 0.08s ease;
        }
        .keypad-del-btn:hover {
            filter: brightness(1.1);
        }
        .keypad-del-btn:active, .keypad-del-btn.pressed {
            transform: translateY(2px) scale(0.96);
            border-bottom-width: 1px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .keypad-ok-btn {
            background: linear-gradient(to bottom, #10b981, #047857);
            border: 1px solid #34d399;
            border-bottom-width: 3px;
            border-bottom-color: #065f46;
            box-shadow: 0 3px 5px -1px rgba(0, 0, 0, 0.25);
            transition: transform 0.08s ease, filter 0.08s ease;
        }
        .keypad-ok-btn:hover {
            filter: brightness(1.1);
        }
        .keypad-ok-btn:active, .keypad-ok-btn.pressed {
            transform: translateY(2px) scale(0.96);
            border-bottom-width: 1px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .floating-elem {
            animation: floatSlow 4s ease-in-out infinite;
        }
        .floating-elem-delay {
            animation: floatSlow 5s ease-in-out infinite 1.5s;
        }
        @keyframes shimmerGlow {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.6)); }
            50% { filter: drop-shadow(0 0 22px rgba(99, 102, 241, 0.9)); }
        }
        .shimmer-title {
            animation: shimmerGlow 3s ease-in-out infinite;
        }
        .crossed-out {
            position: relative;
            opacity: 0.45;
        }
        .crossed-out::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 3.5px;
            background-color: #ef4444;
            transform: rotate(-45deg);
            box-shadow: 0 0 4px rgba(239, 68, 68, 0.9);
        }
    
        .borrow-used-strike { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: #ef4444; }
        .borrow-auto-filled { pointer-events: none; }

        /* Animasi gelaran Wira masa depan: mula WIRA PERKASA dan seterusnya */
        @keyframes wiraFutureBlink {
            0%, 100% { opacity: 0.48; text-shadow: 0 0 0 rgba(34,211,238,0); }
            50% { opacity: 1; text-shadow: 0 0 8px rgba(34,211,238,0.9), 0 0 14px rgba(129,140,248,0.55); }
        }
        .wira-future-blink {
            animation: wiraFutureBlink 1.35s ease-in-out infinite;
        }

        /* Butang Semak Jawapan: glow/blink lembut supaya mudah dikesan murid */
        @keyframes semakJawapanBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 8px rgba(249,115,22,0.32), 0 6px 12px rgba(0,0,0,0.22);
            }
            50% {
                filter: brightness(1.13);
                box-shadow: 0 0 16px rgba(251,146,60,0.78), 0 0 26px rgba(245,158,11,0.34), 0 6px 12px rgba(0,0,0,0.22);
            }
        }
        .semak-jawapan-blink {
            animation: semakJawapanBlink 1.8s ease-in-out infinite;
        }
    </style>

<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-sky-950 text-slate-100 h-[100dvh] flex flex-col items-center justify-center p-1 sm:p-3 overflow-hidden">

    <!-- MAIN GAME CONTAINER -->
    <div id="game-container" class="w-full max-w-md bg-slate-900/95 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-indigo-400/40 flex flex-col overflow-hidden relative h-full max-h-[100dvh] sm:max-h-[96vh]">
        
        <!-- HEADER NAV -->
        <header id="game-header" class="bg-slate-950/85 px-3 py-2 border-b border-indigo-500/30 flex items-center justify-between shrink-0 hidden">
<div id="header-stats" class="ml-auto flex items-center space-x-2.5 text-xs font-bold">
                <span id="stat-score" class="text-accent">⭐ 0</span>
                <span id="stat-streak" class="text-orange-400">🔥 0</span>
                <span id="stat-lives" class="text-danger">❤️❤️❤️</span>
                 <span id="stat-coins" class="text-amber-300">🪙 0</span>
                <button onclick="confirmGoHome()" aria-label="Menu" title="Menu" class="bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:via-blue-500 hover:to-indigo-500 text-white font-display text-xs px-3 py-2 rounded-xl font-extrabold border border-cyan-300/50 shadow-[0_0_14px_rgba(34,211,238,0.45)] transition transform hover:scale-[1.02] active:scale-95">🏠 MENU</button>
            </div>
        </header>

        <!-- DYNAMIC VIEW AREA -->
        <main id="app-view" class="flex-1 overflow-y-auto p-2.5 sm:p-4 flex flex-col justify-between relative">
        </main>
    </div>

    <!-- NOTIFICATION POPUP MODAL -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-box" class="bg-slate-900 border-2 border-indigo-500 rounded-3xl p-5 max-w-xs w-full text-center pop-animation shadow-2xl">
            <div id="modal-icon" class="text-4xl mb-2">🎉</div>
            <h3 id="modal-title" class="font-display text-lg font-bold text-white mb-1">Tajuk Mesej</h3>
            <p id="modal-message" class="text-xs sm:text-sm text-slate-300 mb-5">Mesej kandungan di sini.</p>
            <div id="modal-buttons" class="flex gap-2 justify-center">
                <button onclick="closeModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-2xl font-bold transition w-full shadow-lg text-xs">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SAVE_KEY = 'misi_wira_matematik_lazim_combined_v5';
        
        let gameState = {
            score: 0,
            streak: 0,
            maxStreak: 0,
            correctCount: 0,
            wrongCount: 0,
            lives: 3,
            coins: 0,
            xp: 0,
            level: 1,
            achievements: { firstMission: false, streak5: false, correct10: false, levelUp: false },
            progressByYear: {},
            soundEnabled: true,
            certificates: [],
            bestByYear: {},
            studentProfile: { name: '', className: '' },
            rewards: {
                pejuangTambah: false,
                masterCarry: false,
                wiraMatematik: false,
                masterLazim: false
            }
        };

        let currentYear = 1;
        let currentOperation = 'tambah';
        let currentLevel = 1;
        let questionLimit = 10;
        let currentQuestionIdx = 0;
        let activeQuestionData = null;
        let activeInputCell = null;

        // Rekod satu misi supaya sijil menyimpan SNAPSHOT pencapaian sebenar.
        let missionStartScore = 0;
        let missionStartCorrect = 0;
        let missionStartWrong = 0;
        let missionStartStreak = 0;
        let missionStartTime = 0;
        let missionTimerInterval = null;
        let missionElapsedSeconds = 0;

        const visualIcons = ['🍎', '🍌', '⭐', '🐱', '🐶', '🚗', '🎈', '🐟', '⚽', '🍬', '🍉', '🍦', '🚀', '🐢'];

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNumberClickSound() {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
                
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
                
                osc.start(now);
                osc.stop(now + 0.09);
            } catch(e) {}
        }

        function playDeleteSound() {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.05);
                
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
                
                osc.start(now);
                osc.stop(now + 0.06);
            } catch(e) {}
        }

        function playCorrectSound() {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((f, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(f, now + idx * 0.08);
                    g.gain.setValueAtTime(0.08, now + idx * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.25);
                    o.start(now + idx * 0.08);
                    o.stop(now + idx * 0.08 + 0.25);
                });
            } catch(e) {}
        }

        function playWrongSound() {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(120, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } catch(e) {}
        }

        function playMenuChimeSound() {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } catch(e) {}
        }

        function defaultYearProgress() {
            return { xp: 0, level: 1 };
        }


        function getWiraTitle(level = 1) {
            const lvl = Math.max(1, Number(level) || 1);
            if (lvl >= 100) return { title: 'MASTER WIRA MATEMATIK', emblem: '👑' };
            if (lvl >= 90) return { title: 'WIRA TERTINGGI', emblem: '🏆' };
            if (lvl >= 80) return { title: 'WIRA EPIK', emblem: '🐉' };
            if (lvl >= 70) return { title: 'WIRA LEGENDA', emblem: '🌟' };
            if (lvl >= 60) return { title: 'WIRA AGUNG', emblem: '👑' };
            if (lvl >= 50) return { title: 'WIRA GAGAH', emblem: '🦁' };
            if (lvl >= 40) return { title: 'WIRA BIJAKSANA', emblem: '💎' };
            if (lvl >= 30) return { title: 'WIRA PANTAS', emblem: '⚡' };
            if (lvl >= 20) return { title: 'WIRA PERKASA', emblem: '🔥' };
            if (lvl >= 10) return { title: 'WIRA BERANI', emblem: '🛡️' };
            return { title: 'WIRA MUDA', emblem: '⚔️' };
        }


        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                } catch(e) {}
            }
            ensureProgressState();
            loadYearProgress(currentYear);
        }

        function ensureProgressState() {
            gameState.coins = Number.isFinite(Number(gameState.coins)) ? Number(gameState.coins) : 0;
            gameState.xp = Number.isFinite(Number(gameState.xp)) ? Number(gameState.xp) : 0;
            gameState.level = Number.isFinite(Number(gameState.level)) ? Number(gameState.level) : 1;
            gameState.achievements = Object.assign({ firstMission:false, streak5:false, correct10:false, levelUp:false }, gameState.achievements || {});
            if (!Array.isArray(gameState.certificates)) gameState.certificates = [];
            if (!gameState.bestByYear || typeof gameState.bestByYear !== 'object') gameState.bestByYear = {};
            if (!gameState.studentProfile || typeof gameState.studentProfile !== 'object') gameState.studentProfile = { name:'', className:'' };
            gameState.studentProfile.name = String(gameState.studentProfile.name || '');
            gameState.studentProfile.className = String(gameState.studentProfile.className || '');
            if (!gameState.progressByYear || typeof gameState.progressByYear !== 'object') {
                gameState.progressByYear = {
                    1: { xp: gameState.xp, level: gameState.level },
                    2: defaultYearProgress(),
                    3: defaultYearProgress()
                };
            } else {
                [1, 2, 3].forEach(y => {
                    const p = gameState.progressByYear[y] || {};
                    gameState.progressByYear[y] = {
                        xp: Number.isFinite(Number(p.xp)) ? Number(p.xp) : 0,
                        level: Number.isFinite(Number(p.level)) ? Number(p.level) : 1
                    };
                });
            }
        }

        function saveYearProgress(year = currentYear) {
            ensureProgressState();
            gameState.progressByYear[year] = { xp: gameState.xp || 0, level: gameState.level || 1 };
        }

        function loadYearProgress(year = currentYear) {
            ensureProgressState();
            const p = gameState.progressByYear[year] || defaultYearProgress();
            gameState.xp = p.xp;
            gameState.level = p.level;
        }

        function saveGame() {
            ensureProgressState();
            saveYearProgress(currentYear);
            localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
        }

        function addGameReward() {
            ensureProgressState();
            gameState.coins += 5;
            gameState.xp += 10;
            if (gameState.streak >= 3) gameState.coins += 2;
            if (gameState.streak >= 5) gameState.achievements.streak5 = true;
            if (gameState.correctCount >= 10) gameState.achievements.correct10 = true;
            const oldLevel = gameState.level;
            gameState.level = Math.floor(gameState.xp / 100) + 1;
            saveYearProgress(currentYear);
            if (gameState.level > oldLevel) {
                gameState.achievements.levelUp = true;
                return true;
            }
            return false;
        }

        function showCorrectReward() {
            const levelUp = addGameReward();
            const bonus = gameState.streak >= 3 ? '<br>🔥 Bonus streak: +2 🪙' : '';
            const levelText = levelUp ? `<br><br>🎉 <b>LEVEL UP!</b> Wira kini Level ${gameState.level}!` : '';
            return `+10 ⭐ &nbsp; +5 🪙 &nbsp; +10 XP${bonus}${levelText}`;
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            saveGame();
            updateHeaderStats();
            renderMainMenu();
        }

        function showModal(title, message, icon="🎉", btnText="OK", cb=null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').innerText = icon;
            const btnContainer = document.getElementById('modal-buttons');
            btnContainer.innerHTML = `<button onclick="closeModal(); ${cb ? '('+cb.toString()+')()' : ''}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-2xl font-bold transition w-full shadow-lg text-xs">OK</button>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function confirmGoHome() {
            showModal(
                "🏠 Pasti mahu ke MENU?",
                "Progress misi semasa akan disimpan.\n\nAdakah anda pasti mahu keluar ke MENU?",
                "🏠",
                "TERUSKAN MAIN",
                () => {}
            );
            const btnContainer = document.getElementById('modal-buttons');
            btnContainer.innerHTML = `
                <button onclick="closeModal();" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl font-bold transition w-full shadow text-xs">TERUSKAN MAIN</button>
                <button onclick="closeModal(); goMenu();" class="bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:via-blue-500 hover:to-indigo-500 text-white px-3 py-2 rounded-xl font-bold transition w-full shadow text-xs">🏠 YA, KE MENU</button>
            `;
        }

        function goMenu() {
            closeModal();
            renderMainMenu();
        }

        function updateHeaderStats() {
            document.getElementById('stat-score').innerHTML = `⭐ ${gameState.score}`;
            document.getElementById('stat-streak').innerHTML = `🔥 ${gameState.streak}`;
            document.getElementById('stat-lives').innerHTML = '❤️'.repeat(Math.max(0, gameState.lives));
            const coinEl = document.getElementById('stat-coins');
            if (coinEl) coinEl.innerHTML = `🪙 ${gameState.coins || 0}`;
            const sndBtn = document.getElementById('sound-toggle-btn');
            if (sndBtn) sndBtn.innerHTML = gameState.soundEnabled ? '🔊' : '🔇';

        function generateQuestionForYear(op, year, level = 1, idx = 0) {
            let actualOp = op;
            if (op === 'campuran') {
                actualOp = idx % 2 === 0 ? 'tambah' : 'tolak';
            }

            let a = 0, b = 0, c = 0;
            let numCount = 2;
            let result = 0;
            let carryExpected = { ribu: 0, ratus: 0, puluh: 0 };
            let borrowExpected = { ribu: 0, ratus: 0, puluh: 0, sa: 0 }; 
            let needsCarryOrBorrow = false;
            let isVisual = false;
            let iconA = visualIcons[Math.floor(Math.random() * visualIcons.length)];

            if (level === 1) {
                needsCarryOrBorrow = false;
                numCount = 2;
            } else if (level === 2) {
                needsCarryOrBorrow = Math.random() < 0.5;
                numCount = Math.random() < 0.4 ? 3 : 2;
            } else {
                needsCarryOrBorrow = true;
                numCount = Math.random() < 0.5 ? 3 : 2;
            }

            if (year === 1) {
                if (level === 1) {
                    isVisual = true;
                    if (actualOp === 'tambah') {
                        a = Math.floor(Math.random() * 15) + 1;
                        b = Math.floor(Math.random() * 15) + 1;
                        if (a + b > 30) b = 30 - a;
                    } else {
                        a = Math.floor(Math.random() * 10) + 5;
                        b = Math.floor(Math.random() * (a - 1)) + 1;
                    }
                } else if (level === 2) {
                    isVisual = false;
                    if (actualOp === 'tambah') {
                        if (idx < 5) {
                            // 5 soalan pertama: 1 digit + 1 digit, TANPA kumpul semula.
                            // Jumlah mesti <= 9.
                            a = Math.floor(Math.random() * 8) + 1; // 1..8
                            b = Math.floor(Math.random() * (9 - a)) + 1; // 1..(9-a)
                        } else {
                            // 5 soalan seterusnya: 1 digit + 2 digit, TANPA kumpul semula.
                            // Unit nombor 2 digit + digit pertama mesti <= 9.
                            const t1 = Math.floor(Math.random() * 9) + 1; // 1..9
                            const u1 = Math.floor(Math.random() * 9); // 0..8
                            const maxB = 9 - u1;
                            a = t1 * 10 + u1;
                            b = Math.floor(Math.random() * maxB) + 1; // 1..(9-u1)
                        }
                    } else {
                        if (idx < 5) {
                            // 5 soalan: 1 digit − 1 digit, TANPA kumpul semula.
                            a = Math.floor(Math.random() * 9) + 1;
                            b = Math.floor(Math.random() * a) + 1;
                        } else {
                            // 5 soalan: 2 digit − 1 digit, TANPA kumpul semula.
                            const tens = Math.floor(Math.random() * 9) + 1; // 1..9
                            b = Math.floor(Math.random() * 9) + 1;           // 1..9
                            const units = Math.floor(Math.random() * (10 - b)) + b; // b..9
                            a = tens * 10 + units;
                        }
                        needsCarryOrBorrow = false;
                    }
                } else {
                    isVisual = false;
                    if (actualOp === 'tambah') {
                        let t1 = Math.floor(Math.random() * 4) + 1;
                        let t2 = Math.floor(Math.random() * (4 - t1)) + 1;
                        let u1 = Math.floor(Math.random() * 4) + 1;
                        let u2 = Math.floor(Math.random() * (8 - u1)) + 1;
                        a = t1 * 10 + u1;
                        b = t2 * 10 + u2;
                    } else {
                        // 2 digit − 2 digit, TANPA kumpul semula.
                        let t1 = Math.floor(Math.random() * 5) + 5; // 5..9
                        let t2 = Math.floor(Math.random() * (t1 - 1)) + 1; // 1..t1-1
                        let u1 = Math.floor(Math.random() * 5) + 5; // 5..9
                        let u2 = Math.floor(Math.random() * (u1 + 1)); // 0..u1
                        a = t1 * 10 + u1;
                        b = t2 * 10 + u2;
                        needsCarryOrBorrow = false;
                    }
                }
                result = actualOp === 'tambah' ? (a + b) : (a - b);
            } else if (year === 2) {
                if (actualOp === 'tambah') {
                    // TAHUN 2 TAMBAH: semua addend <= 999 dan hasil <= 1000.
                    if (level === 3 && Math.random() < 0.3) {
                        if (numCount === 2) {
                            a = Math.floor(Math.random() * 800) + 200;
                            b = 1000 - a;
                        } else {
                            a = Math.floor(Math.random() * 400) + 100;
                            b = Math.floor(Math.random() * 400) + 100;
                            const maxC = 1000 - a - b;
                            c = Math.max(1, Math.floor(Math.random() * Math.max(1, maxC)) + 1);
                            if (a + b + c > 1000) c = 1000 - a - b;
                        }
                    } else if (!needsCarryOrBorrow) {
                        if (numCount === 2) {
                            let u1 = Math.floor(Math.random() * 4) + 1;
                            let u2 = Math.floor(Math.random() * (9 - u1)) + 1;
                            let d1 = Math.floor(Math.random() * 4) + 1;
                            let d2 = Math.floor(Math.random() * (8 - d1)) + 1;
                            let h1 = Math.floor(Math.random() * 3) + 1;
                            let h2 = Math.floor(Math.random() * (7 - h1)) + 1;
                            a = h1 * 100 + d1 * 10 + u1;
                            b = h2 * 100 + d2 * 10 + u2;
                        } else {
                            a = Math.floor(Math.random() * 300) + 100;
                            b = Math.floor(Math.random() * 200) + 100;
                            const maxC = 1000 - a - b;
                            c = Math.max(10, Math.floor(Math.random() * Math.max(1, maxC - 9)) + 10);
                            if (a + b + c > 1000) c = 1000 - a - b;
                        }
                        carryExpected = { ribu: 0, ratus: 0, puluh: 0 };
                    } else {
                        if (numCount === 2) {
                            a = Math.floor(Math.random() * 500) + 100;
                            b = Math.floor(Math.random() * (999 - a)) + 1;
                            if (a + b > 1000) b = 1000 - a;
                        } else {
                            a = Math.floor(Math.random() * 300) + 100;
                            b = Math.floor(Math.random() * 300) + 100;
                            const maxC = 1000 - a - b;
                            c = Math.max(10, Math.floor(Math.random() * Math.max(1, maxC - 9)) + 10);
                            if (a + b + c > 1000) c = 1000 - a - b;
                        }
                        let sumU = (a % 10) + (b % 10) + (numCount === 3 ? (c % 10) : 0);
                        let cPuluh = Math.floor(sumU / 10);
                        let sumD = Math.floor((a % 100) / 10) + Math.floor((b % 100) / 10) + (numCount === 3 ? Math.floor((c % 100) / 10) : 0) + cPuluh;
                        let cRatus = Math.floor(sumD / 10);
                        let sumH = Math.floor((a % 1000) / 100) + Math.floor((b % 1000) / 100) + (numCount === 3 ? Math.floor((c % 1000) / 100) : 0) + cRatus;
                        let cRibu = Math.floor(sumH / 10);
                        carryExpected = { ribu: cRibu, ratus: cRatus, puluh: cPuluh };
                    }
                    result = numCount === 3 ? (a + b + c) : (a + b);
                } else {
                    if (!needsCarryOrBorrow) {
                        let h1 = Math.floor(Math.random() * 4) + 5;
                        let h2 = Math.floor(Math.random() * h1) + 1;
                        let d1 = Math.floor(Math.random() * 4) + 5;
                        let d2 = Math.floor(Math.random() * d1);
                        let u1 = Math.floor(Math.random() * 5) + 5;
                        let u2 = Math.floor(Math.random() * u1);
                        a = h1 * 100 + d1 * 10 + u1;
                        b = h2 * 100 + d2 * 10 + u2;
                        borrowExpected = { ratus: 0, puluh: 0, sa: 0 };
                    } else {
                        let h1 = Math.floor(Math.random() * 3) + 5;
                        let h2 = Math.floor(Math.random() * 3) + 1;
                        let d1 = Math.floor(Math.random() * 4) + 1;
                        let d2 = Math.floor(Math.random() * 4) + d1 + 1;
                        let u1 = Math.floor(Math.random() * 4) + 1;
                        let u2 = Math.floor(Math.random() * 4) + u1 + 1;
                        a = h1 * 100 + d1 * 10 + u1;
                        b = h2 * 100 + d2 * 10 + u2;

                        let uStr = String(a).slice(-1);
                        let bStr = String(b).slice(-1);
                        let bU = (parseInt(uStr) < parseInt(bStr)) ? 1 : 0;
                        
                        let dStr = String(Math.floor((a%100)/10));
                        let bdStr = String(Math.floor((b%100)/10));
                        let adjD = parseInt(dStr) - bU;
                        let bD = (adjD < parseInt(bdStr)) ? 1 : 0;

                        borrowExpected = { ratus: 0, puluh: bD, sa: bU };
                    }
                    result = a - b;
                }
            } else if (year === 3) {
                if (actualOp === 'tambah') {
                    if (level === 3 && Math.random() < 0.25) {
                        if (numCount === 2) {
                            a = Math.floor(Math.random() * 8000) + 1000;
                            b = 10000 - a;
                        } else {
                            a = Math.floor(Math.random() * 3000) + 1000;
                            b = Math.floor(Math.random() * 3000) + 1000;
                            c = 10000 - (a + b);
                        }
                    } else if (!needsCarryOrBorrow) {
                        if (numCount === 2) {
                            let u1 = Math.floor(Math.random() * 4) + 1;
                            let u2 = Math.floor(Math.random() * (8 - u1)) + 1;
                            let d1 = Math.floor(Math.random() * 4) + 1;
                            let d2 = Math.floor(Math.random() * (8 - d1)) + 1;
                            let h1 = Math.floor(Math.random() * 4) + 1;
                            let h2 = Math.floor(Math.random() * (8 - h1)) + 1;
                            let th1 = Math.floor(Math.random() * 3) + 1;
                            let th2 = Math.floor(Math.random() * (6 - th1)) + 1;
                            a = th1 * 1000 + h1 * 100 + d1 * 10 + u1;
                            b = th2 * 1000 + h2 * 100 + d2 * 10 + u2;
                        } else {
                            a = Math.floor(Math.random() * 3000) + 1000;
                            b = Math.floor(Math.random() * 2000) + 1000;
                            c = Math.floor(Math.random() * 2000) + 500;
                            while (a + b + c > 10000) {
                                a = Math.floor(Math.random() * 2500) + 500;
                                b = Math.floor(Math.random() * 2500) + 500;
                                c = Math.floor(Math.random() * 2000) + 500;
                            }
                        }
                        carryExpected = { ribu: 0, ratus: 0, puluh: 0 };
                    } else {
                        if (numCount === 2) {
                            a = Math.floor(Math.random() * 4000) + 1000;
                            b = Math.floor(Math.random() * 4000) + 1000;
                            if (a + b > 10000) b = 10000 - a;
                        } else {
                            a = Math.floor(Math.random() * 3000) + 1000;
                            b = Math.floor(Math.random() * 3000) + 1000;
                            c = Math.floor(Math.random() * 2000) + 500;
                            if (a + b + c > 10000) {
                                c = 10000 - (a + b);
                                if (c < 100) c = 100;
                            }
                        }
                        let sumU = (a % 10) + (b % 10) + (numCount === 3 ? (c % 10) : 0);
                        let cPuluh = Math.floor(sumU / 10);
                        let sumD = Math.floor((a % 100) / 10) + Math.floor((b % 100) / 10) + (numCount === 3 ? Math.floor((c % 100) / 10) : 0) + cPuluh;
                        let cRatus = Math.floor(sumD / 10);
                        let sumH = Math.floor((a % 1000) / 100) + Math.floor((b % 1000) / 100) + (numCount === 3 ? Math.floor((c % 1000) / 100) : 0) + cRatus;
                        let cRibu = Math.floor(sumH / 10);
                        carryExpected = { ribu: cRibu, ratus: cRatus, puluh: cPuluh };
                    }
                    result = numCount === 3 ? (a + b + c) : (a + b);
                } else {
                    // TAHUN 3 TOLAK — SEMENTARA GUNA KONSEP TAHUN 2.
                    // 4 digit, tetapi logik jana soalan dan pinjaman mengikut konsep
                    // Tahun 2: semak lajur dari SA -> PULUH -> RATUS -> RIBU.
                    numCount = 2;
                    isVisual = false;

                    const calcBorrowFlags = (top, bottom) => {
                        const uA = top % 10, uB = bottom % 10;
                        const borrowSa = uA < uB ? 1 : 0;

                        const dA = Math.floor(top / 10) % 10;
                        const dB = Math.floor(bottom / 10) % 10;
                        const effectiveD = dA - borrowSa;
                        const borrowPuluh = effectiveD < dB ? 1 : 0;

                        const hA = Math.floor(top / 100) % 10;
                        const hB = Math.floor(bottom / 100) % 10;
                        const effectiveH = hA - borrowPuluh;
                        const borrowRatus = effectiveH < hB ? 1 : 0;

                        const thA = Math.floor(top / 1000) % 10;
                        const thB = Math.floor(bottom / 1000) % 10;
                        const effectiveTh = thA - borrowRatus;
                        const borrowRibu = effectiveTh < thB ? 1 : 0;

                        return { sa: borrowSa, puluh: borrowPuluh, ratus: borrowRatus, ribu: borrowRibu };
                    };

                    if (!needsCarryOrBorrow) {
                        // Tiada pinjaman: setiap lajur atas >= bawah.
                        do {
                            const th1 = Math.floor(Math.random() * 8) + 2;
                            const th2 = Math.floor(Math.random() * (th1 - 1)) + 1;
                            const h1 = Math.floor(Math.random() * 9);
                            const h2 = Math.floor(Math.random() * (h1 + 1));
                            const d1 = Math.floor(Math.random() * 9);
                            const d2 = Math.floor(Math.random() * (d1 + 1));
                            const u1 = Math.floor(Math.random() * 10);
                            const u2 = Math.floor(Math.random() * (u1 + 1));

                            a = th1 * 1000 + h1 * 100 + d1 * 10 + u1;
                            b = th2 * 1000 + h2 * 100 + d2 * 10 + u2;
                        } while (a <= b || calcBorrowFlags(a, b).sa || calcBorrowFlags(a, b).puluh || calcBorrowFlags(a, b).ratus || calcBorrowFlags(a, b).ribu);
                    } else {
                        // Ada pinjaman: jana sehingga sekurang-kurangnya satu lajur perlu pinjaman,
                        // tetapi tidak memerlukan pinjaman dari P.RIBU.
                        do {
                            a = Math.floor(Math.random() * 9000) + 1000;
                            b = Math.floor(Math.random() * (a - 1)) + 1;
                            if (b < 1000) continue;
                            const flags = calcBorrowFlags(a, b);
                            if (flags.ribu) continue;
                            if (!(flags.sa || flags.puluh || flags.ratus)) continue;

                            // Jika satu lajur memerlukan pinjaman, nombor asal
                            // di atas dan bawah pada lajur itu mesti BERBEZA.
                            // Elakkan kes seperti 0 - 0 / 3 - 3 yang boleh
                            // menyebabkan murid nampak kotak/efek pinjaman
                            // walaupun nombor pada lajur kelihatan sama.
                            const topDigits = [a % 10, Math.floor(a / 10) % 10, Math.floor(a / 100) % 10, Math.floor(a / 1000) % 10];
                            const bottomDigits = [b % 10, Math.floor(b / 10) % 10, Math.floor(b / 100) % 10, Math.floor(b / 1000) % 10];
                            const borrowFlags = [flags.sa, flags.puluh, flags.ratus, flags.ribu];
                            if (borrowFlags.some((need, i) => need && topDigits[i] === bottomDigits[i])) continue;

                            break;
                        } while (true);
                    }

                    const flags = calcBorrowFlags(a, b);
                    borrowExpected = {
                        ribu: 0,
                        ratus: flags.ratus,
                        puluh: flags.puluh,
                        sa: flags.sa
                    };
                    result = a - b;
                }
            }

            let choices = [];
            if (isVisual) {
                choices.push(result);
                while (choices.length < 3) {
                    let wrong = result + (Math.floor(Math.random() * 7) - 3);
                    if (wrong !== result && wrong >= 0 && !choices.includes(wrong)) {
                        choices.push(wrong);
                    }
                }
                choices.sort(() => Math.random() - 0.5);
            }

            return {
                op: actualOp,
                year: year,
                level: level,
                isVisual: isVisual,
                numCount: numCount,
                a: a,
                b: b,
                c: c,
                result: result,
                choices: choices,
                iconA: iconA,
                carryExpected: carryExpected,
                borrowExpected: borrowExpected,
                needsCarry: needsCarryOrBorrow
            };
        }

        function formatMissionTime(totalSeconds) {
            const s = Math.max(0, Math.floor(Number(totalSeconds) || 0));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return h > 0 ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }

        }

                                    <td class="p-1 border-r border-indigo-500/20"><input type="text" maxlength="1" readonly onclick="focusCell(this)" id="ans-puluh" class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-center cursor-pointer focus:outline-none shadow-inner text-xs patch-box-bottom-styled" placeholder="?"></td>

                } else {
                    // TAHUN 3 TOLAK — GUNA KONSEP & CARA PAPAR TAHUN 2.
                    // Bezanya: Tahun 3 menggunakan 4 digit (RIBU | RATUS | PULUH | SA).
                    // P.RIBU dikekalkan sebagai ruang tambahan sahaja.
                    const uA = q.a % 10;
                    const uB = q.b % 10;
                    const needSaBorrow = uA < uB;

                    const dA = Math.floor((q.a % 100) / 10);
                    const dB = Math.floor((q.b % 100) / 10);
                    const adjDA = dA - (needSaBorrow ? 1 : 0);
                    const needPuluhBorrow = adjDA < dB;

                    const hA = Math.floor((q.a % 1000) / 100);
                    const hB = Math.floor((q.b % 1000) / 100);
                    const adjHA = hA - (needPuluhBorrow ? 1 : 0);
                    const needRatusBorrow = adjHA < hB;

                    const thA = Math.floor(q.a / 1000);
                    const thB = Math.floor(q.b / 1000);
                    const adjThA = thA - (needRatusBorrow ? 1 : 0);
                    const needRibuBorrow = adjThA < thB;

                    // Untuk sementara, sama seperti Tahun 2: kotak hanya pada
                    // lajur yang benar-benar menerima pinjaman.
                    let aSubArr = String(q.a).padStart(4, ' ').split('');
                    let bSubArr = String(q.b).padStart(4, ' ').split('');

                    let borrowBoxSaHtml = needSaBorrow
                        ? `<input type="text" maxlength="2" readonly onclick="focusCell(this)" id="borrow-in-sa" class="w-7 h-5 sm:w-8 sm:h-6 rounded font-bold text-center cursor-pointer focus:outline-none shadow mx-auto block text-[10px] patch-box-top-styled" placeholder=" ">`

                    let borrowBoxPuluhHtml = needPuluhBorrow
                        ? `<input type="text" maxlength="2" readonly onclick="focusCell(this)" id="borrow-in-puluh" class="w-7 h-5 sm:w-8 sm:h-6 rounded font-bold text-center cursor-pointer focus:outline-none shadow mx-auto block text-[10px] patch-box-top-styled" placeholder=" ">`
                        : '';
                    let borrowBoxRatusHtml = needRatusBorrow
                        ? `<input type="text" maxlength="2" readonly onclick="focusCell(this)" id="borrow-in-ratus" class="w-7 h-5 sm:w-8 sm:h-6 rounded font-bold text-center cursor-pointer focus:outline-none shadow mx-auto block text-[10px] patch-box-top-styled" placeholder=" ">`
                        : '';
                    let borrowBoxRibuHtml = needRibuBorrow
                        ? `<input type="text" maxlength="2" readonly onclick="focusCell(this)" id="borrow-in-ribu" class="w-7 h-5 sm:w-8 sm:h-6 rounded font-bold text-center cursor-pointer focus:outline-none shadow mx-auto block text-[10px] patch-box-top-styled" placeholder=" ">`
                        : '';

                    let borrowRowHtml = `
                        <tr class="border-b border-indigo-500/20 bg-slate-900/40 text-center text-[10px]">
                            <td class="p-0.5 border-r border-indigo-500/20"></td>

                            <td class="p-0.5">${borrowBoxSaHtml}</td>

                    `;

                    tableHtml = `
                        <table class="w-full text-center font-mono text-xs sm:text-sm border-collapse">

                                    <td class="p-1 border-r border-indigo-500/20" id="row-proses-ratus"><span id="digit-ratus-val">${aSubArr[1]}</span></td>
                                    <td class="p-1 border-r border-indigo-500/20" id="row-proses-puluh"><span id="digit-puluh-val">${aSubArr[2]}</span></td>

                                    <td class="p-1 border-r border-indigo-500/20">${bSubArr[2]}</td>
                                    <td class="p-1">${bSubArr[3]}</td>
                                </tr>
                                <tr class="font-bold">
                                    <td class="p-1 border-r border-indigo-500/20">${(q.result >= 10000) ? `<input type="text" maxlength="1" readonly onclick="focusCell(this)" id="ans-puluhribu" class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-center cursor-pointer focus:outline-none shadow-inner text-xs patch-box-bottom-styled" placeholder="?">` : ''}</td>
                                    <td class="p-1 border-r border-indigo-500/20"><input type="text" maxlength="1" readonly onclick="focusCell(this)" id="ans-ribu" class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-center cursor-pointer focus:outline-none shadow-inner text-xs patch-box-bottom-styled" placeholder="?"></td>
                                    <td class="p-1 border-r border-indigo-500/20"><input type="text" maxlength="1" readonly onclick="focusCell(this)" id="ans-ratus" class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-center cursor-pointer focus:outline-none shadow-inner text-xs patch-box-bottom-styled" placeholder="?"></td>
                                    <td class="p-1 border-r border-indigo-500/20"><input type="text" maxlength="1" readonly onclick="focusCell(this)" id="ans-puluh" class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-center cursor-pointer focus:outline-none shadow-inner text-xs patch-box-bottom-styled" placeholder="?"></td>
                                    <td class="p-1"><input type="text" maxlength="1" readonly onclick="focusCell(this)" id="ans-sa" class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-center cursor-pointer focus:outline-none shadow-inner text-xs patch-box-bottom-styled" placeholder="?"></td>
                                </tr>

                    `;
                }
            }

            view.innerHTML = `
                <div class="flex flex-col h-full">
                    <div class="shrink-0">

                            <span class="text-indigo-300">📚 Tahun ${currentYear} (Aras ${currentLevel})</span>
                            <span class="flex items-center gap-2">
    <span class="mission-timer flex items-center gap-1.5">
        <svg class="mission-clock-icon" viewBox="0 0 24 24" aria-hidden="true">

        <span id="missionTimer">00:00</span>
    </span>
    <span class="text-accent">• ❓ Soalan ${currentQuestionIdx + 1}/${questionLimit}</span>
</span>
                        </div>

                        <div class="bg-slate-950/80 border-2 border-indigo-500/40 p-2 sm:p-3 rounded-2xl shadow-xl flex flex-col items-center overflow-x-auto">

                            ${tableHtml}
                        </div>
                    </div>

                    <div class="bg-slate-950/95 border border-indigo-500/40 p-1.5 sm:p-2 rounded-2xl mt-1 mb-0 shadow-lg max-w-xs mx-auto w-full shrink-0">
                        <div class="text-[9px] sm:text-[10px] text-center font-bold text-indigo-300 mb-1 uppercase tracking-wider">PILIH NOMBOR</div>
                        <div class="grid grid-cols-3 gap-1 sm:gap-1.5">
                            <button onclick="handleKeypadPress(1, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">1</button>
                            <button onclick="handleKeypadPress(2, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">2</button>
                            <button onclick="handleKeypadPress(3, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">3</button>
                            <button onclick="handleKeypadPress(4, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">4</button>
                            <button onclick="handleKeypadPress(5, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">5</button>
                            <button onclick="handleKeypadPress(6, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">6</button>
                            <button onclick="handleKeypadPress(7, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">7</button>
                            <button onclick="handleKeypadPress(8, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">8</button>
                            <button onclick="handleKeypadPress(9, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">9</button>
                            <button onclick="handleKeypadPress(0, this)" class="keypad-num-btn text-white font-display text-base sm:text-lg font-bold py-1.5 sm:py-2 rounded-xl text-center">0</button>
                            <button onclick="handleDeletePress(this)" class="keypad-del-btn text-white font-display text-xs font-bold py-1.5 sm:py-2 rounded-xl text-center flex items-center justify-center">⌫ PADAM</button>
                            <button onclick="handleOkPress(this)" class="keypad-ok-btn text-white font-display text-xs font-bold py-1.5 sm:py-2 rounded-xl text-center flex items-center justify-center">OK</button>
                        </div>
                    </div>

                    <div class="shrink-0 pt-1 pb-1 mt-1 bg-slate-900/95">
                        <button onclick="checkAnswer()" class="semak-jawapan-blink w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-white font-display font-bold text-sm sm:text-base py-2.5 sm:py-3 rounded-2xl shadow-lg transition transform active:scale-95 border-b-4 border-orange-800">
                            ✨ SEMAK JAWAPAN
                        </button>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const defaultBox = document.getElementById('ans-sa');
                if (defaultBox) focusCell(defaultBox);
            }, 50);
        }

        function focusCell(inputElem) {
            document.querySelectorAll('#app-view input').forEach(el => {
                el.classList.remove('ring-2', 'ring-amber-400');
            });
            activeInputCell = inputElem;
            activeInputCell.classList.add('ring-2', 'ring-amber-400');
        }

        function handleKeypadPress(num, btnElem) {
            btnElem.classList.add('pressed');
            setTimeout(() => btnElem.classList.remove('pressed'), 130);
            
            playNumberClickSound();
            inputKeypadNumber(num);
        }

        function handleDeletePress(btnElem) {
            btnElem.classList.add('pressed');
            setTimeout(() => btnElem.classList.remove('pressed'), 130);
            
            playDeleteSound();
            inputKeypadDelete();
        }

        function handleOkPress(btnElem) {
            btnElem.classList.add('pressed');
            setTimeout(() => btnElem.classList.remove('pressed'), 130);
            
            playNumberClickSound();
            keypadOk();
        }

        function inputKeypadNumber(num) {
            if (!activeInputCell) {
                activeInputCell = document.getElementById('ans-sa');
            }
            if (activeInputCell) {
                if (activeInputCell.id === 'borrow-in-sa' || activeInputCell.id === 'borrow-in-puluh' || activeInputCell.id === 'borrow-in-ratus' || activeInputCell.id === 'borrow-in-ribu') {
                    let currentVal = activeInputCell.value || '';
                    if (currentVal.length >= 2) {
                        currentVal = String(num);
                    } else {
                        currentVal += num;
                    }
                    activeInputCell.value = currentVal;

                    if (activeInputCell.value === '10') {
                        triggerBorrowVisual(activeInputCell.id);
                    } else {
                        revertBorrowVisual(activeInputCell.id);
                    }
                } else {
                    let currentVal = activeInputCell.value || '';
                    if (activeInputCell.maxLength === 2 && currentVal.length < 2) {
                        activeInputCell.value = currentVal + num;
                    } else {
                        activeInputCell.value = String(num);
                    }
                }

                activeInputCell.classList.add('bg-indigo-950');
                
                const allInputs = Array.from(document.querySelectorAll('#app-view input'));
                const idx = allInputs.indexOf(activeInputCell);
                if (idx !== -1 && idx + 1 < allInputs.length && activeInputCell.value.length === (activeInputCell.maxLength || 1)) {
                    focusCell(allInputs[idx + 1]);
                }
            }
        }

        function triggerBorrowVisual(inputId) {
            const q = activeQuestionData;
            let aStr = String(q.a).padStart(4, ' ');
            let aArr = aStr.split('');

            // KONSEP PINJAMAN: digit yang menerima 10 KEKAL.
            // Yang dipotong hanya 1 nilai tempat pada lajur pemberi pinjaman.
            // Contoh SA: 10 diletak dalam kotak pinjaman di atas digit 1;
            // digit 1 TIDAK dipotong. Kiraan ialah 10 + 1 - digit bawah.
            const box = document.getElementById(inputId);
            // Kotak pinjaman (10) TIDAK dipalang. Hanya digit asal pemberi pinjaman yang dipalang.

            if (inputId === 'borrow-in-sa') {
                const pDisp = document.getElementById('digit-puluh-val');
                const lenderPuluh = Math.floor((q.a % 100) / 10);

                // CASCADE KHAS: jika Puluh asal = 0, SA yang meminjam
                // perlu mengambil 1 Puluh daripada Ratus terlebih dahulu.
                // Jadi Puluh menerima 10 secara automatik, 10 itu digunakan
                // untuk memberi 1 Puluh kepada SA, lalu baki Puluh = 9.
                if (lenderPuluh === 0) {
                    // AUTO KHAS: SA perlu pinjam tetapi Puluh = 0.
                    // 1) SA mendapat 10.
                    // 2) Kotak Puluh AUTO diisi 10.
                    // 3) 10 di kotak Puluh dipalang dan baki 9 ditunjukkan.
                    // 4) Auto tolak 1 daripada Ratus.
                    // Ini HANYA berlaku apabila SA meminjam DAN Puluh asal = 0.
                    const autoPuluh = document.getElementById('borrow-in-puluh');
                    if (autoPuluh) {
                        autoPuluh.value = '10';
                        autoPuluh.classList.add('borrow-auto-filled', 'bg-indigo-950');

                        // Kotak AUTO Puluh mesti sendiri menunjukkan 10 dipalang -> 9.
                        // Input sebenar disorok supaya nombor tidak bertindih.
                        autoPuluh.style.display = 'none';
                        const puluhBox = autoPuluh.parentElement;
                        if (puluhBox && !puluhBox.querySelector('.auto-puluh-borrow-visual')) {
                            const visual = document.createElement('span');
                            visual.className = 'auto-puluh-borrow-visual';
                            visual.innerHTML = '<span class="strike-red">10</span><span class="text-emerald-400 font-bold ml-1">9</span>';
                            visual.style.cssText = 'display:flex; align-items:center; justify-content:center; width:2.7rem; height:1.5rem; margin:0 auto; border:2px solid #38bdf8; border-radius:0.25rem; font-size:0.7rem; font-weight:700; background:transparent; box-sizing:border-box; pointer-events:none; white-space:nowrap;';
                            puluhBox.appendChild(visual);
                        }
                    }

                    // PENTING:
                    // Puluh asal = 0 mesti KEKAL 0 dan TIADA palang/perubahan.
                    // Nilai 10 -> 9 hanya berada di KOTAK PINJAMAN Puluh di atas.
                    if (pDisp) {
                        pDisp.textContent = '0';
                    }

                    // Ratus menjadi pemberi pinjaman: Ratus - 1.
                    // Jangan buat cascade lain di sini.
                    const lenderRatus = Math.floor((q.a % 1000) / 100);
                    const hDisp = document.getElementById('digit-ratus-val');
                    if (lenderRatus > 0 && hDisp) {
                        hDisp.innerHTML = `<span class="strike-red">${lenderRatus}</span> <span class="text-emerald-400 font-bold ml-1">${lenderRatus - 1}</span>`;
                    }
                } else {
                    if (pDisp) {
                        pDisp.innerHTML = `<span class="strike-red">${aArr[2]}</span> <span class="text-emerald-400 font-bold ml-1">${lenderPuluh - 1}</span>`;
                    }
                }
                // SA asal sengaja TIDAK diubah/dipotong.
            } else if (inputId === 'borrow-in-puluh') {
                const hDisp = document.getElementById('digit-ratus-val');
                const lenderRatus = Math.floor((q.a % 1000) / 100);

                // KES KHAS: Ratus asal = 0.
                // Puluh yang perlu pinjam tidak boleh terus menjadikan Ratus -1.
                // Ratus mesti menerima 10 daripada Ribu dahulu, kemudian:
                // Ratus: 10 -> 9 (10 dipalang, baki 9)
                // Ribu: asal -> asal - 1
                const autoRatus = document.getElementById('borrow-in-ratus');

                if (lenderRatus === 0) {
                    if (autoRatus) {
                        autoRatus.value = '10';
                        autoRatus.classList.add('borrow-auto-filled', 'bg-indigo-950');

                        // Kotak AUTO Ratus mesti sendiri menunjukkan 10 dipalang -> 9.
                        // Input sebenar disorok supaya 0 di baris Ratus kekal KOSONG
                        // dan tiada nombor bertindih.
                        autoRatus.style.display = 'none';
                        const ratusBox = autoRatus.parentElement;
                        if (ratusBox && !ratusBox.querySelector('.auto-ratus-borrow-visual')) {
                            const visual = document.createElement('span');
                            visual.className = 'auto-ratus-borrow-visual';
                            visual.innerHTML = '<span class="strike-red">10</span><span class="text-emerald-400 font-bold ml-1">9</span>';
                            visual.style.cssText = 'display:flex; align-items:center; justify-content:center; width:2.7rem; height:1.5rem; margin:0 auto; border:2px solid #38bdf8; border-radius:0.25rem; font-size:0.7rem; font-weight:700; background:transparent; box-sizing:border-box; pointer-events:none; white-space:nowrap;';
                            ratusBox.appendChild(visual);
                        }
                    }

                    // Ratus asal = 0: ruang nombor asal kekal KOSONG.
                    // Nilai 10 -> 9 hanya dipaparkan pada kotak pinjaman Ratus.
                    if (hDisp) {
                        hDisp.textContent = '';
                    }

                    const lenderRibu = Math.floor(q.a / 1000);
                    const thDisp = document.getElementById('digit-ribu-val');
                    if (lenderRibu > 0 && thDisp) {
                        thDisp.innerHTML = `<span class="strike-red">${lenderRibu}</span> <span class="text-emerald-400 font-bold ml-1">${lenderRibu - 1}</span>`;
                    }
                } else {
                    if (hDisp) {
                        hDisp.innerHTML = `<span class="strike-red">${aArr[1]}</span> <span class="text-emerald-400 font-bold ml-1">${lenderRatus - 1}</span>`;
                    }
                }
                // Puluh asal juga KEKAL; 10 dalam kotak ialah nilai pinjaman.
            } else if (inputId === 'borrow-in-ratus') {
                const thDisp = document.getElementById('digit-ribu-val');
                if (thDisp) {
                    const lender = Math.floor(q.a / 1000);
                    thDisp.innerHTML = `<span class="strike-red">${aArr[0]}</span> <span class="text-emerald-400 font-bold ml-1">${lender - 1}</span>`;
                }
                // Ratus asal KEKAL; 10 dalam kotak ialah nilai pinjaman.
            }
        }

        function revertBorrowVisual(inputId) {
            const q = activeQuestionData;
            let aStr = String(q.a).padStart(4, ' ');
            let aArr = aStr.split('');

            if (inputId === 'borrow-in-sa') {
                const pDisp = document.getElementById('digit-puluh-val');
                if (pDisp) pDisp.innerHTML = aArr[2];
            } else if (inputId === 'borrow-in-puluh') {
                const hDisp = document.getElementById('digit-ratus-val');
                if (hDisp) hDisp.innerHTML = aArr[1];
            } else if (inputId === 'borrow-in-ratus') {
                const thDisp = document.getElementById('digit-ribu-val');
                if (thDisp) thDisp.innerHTML = aArr[0];
            }
        }

        function inputKeypadDelete() {
            if (activeInputCell) {
                activeInputCell.value = '';
                activeInputCell.classList.remove('bg-indigo-950');

                if (activeInputCell.id === 'borrow-in-sa' || activeInputCell.id === 'borrow-in-puluh' || activeInputCell.id === 'borrow-in-ratus' || activeInputCell.id === 'borrow-in-ribu') {
                    activeInputCell.classList.remove('borrow-used-strike', 'borrow-auto-filled');
                    revertBorrowVisual(activeInputCell.id);
                    // Jika SA dibuang, kosongkan semula kotak cascade automatik.
                    if (activeInputCell.id === 'borrow-in-sa') {
                        ['borrow-in-puluh','borrow-in-ratus','borrow-in-ribu'].forEach(id => {
                            const el = document.getElementById(id);
                            if (el && el.classList.contains('borrow-auto-filled')) {
                                el.value = '';
                                el.classList.remove('borrow-used-strike','borrow-auto-filled','bg-indigo-950');
                                el.style.color = '';
                                el.style.display = '';
                                const box = el.parentElement;
                                const visual = box && box.querySelector('.auto-ratus-borrow-visual, .auto-puluh-borrow-visual');
                                if (visual) visual.remove();
                            }
                        });
                        const q = activeQuestionData;
                        const pDisp = document.getElementById('digit-puluh-val');
                        const hDisp = document.getElementById('digit-ratus-val');
                        const thDisp = document.getElementById('digit-ribu-val');
                        if (pDisp) pDisp.textContent = String(Math.floor((q.a % 100) / 10));

                            autoRatus.style.display = '';

                        const hDisp = document.getElementById('digit-ratus-val');
                        const thDisp = document.getElementById('digit-ribu-val');

                        if (thDisp) thDisp.textContent = String(Math.floor(q.a / 1000));
                    }
                }
            }
