        function checkAnswer() {
            const q = activeQuestionData;
            let isCorrect = true;
            let errorMsg = "";

            if (q.year === 1 && q.level === 2 && q.op === 'tambah' && currentQuestionIdx < 5) {
                let ansPuluhElem = document.getElementById('ans-puluh');
                let ansSaElem = document.getElementById('ans-sa');
                let ansPuluh = ansPuluhElem ? ansPuluhElem.value : '';
                let ansSa = ansSaElem ? ansSaElem.value : '';

                let totalSum = q.a + q.b;
                let hasPuluhBox = totalSum >= 10;

                if (ansSa === '' || (hasPuluhBox && ansPuluh === '')) {
                    showModal("Belum Lengkap", "Sila isi semua kotak jawapan yang diperlukan.", "⚠️", "OK");
                    return;
                }

                let userResultNum = parseInt((hasPuluhBox ? (ansPuluh + ansSa) : ansSa), 10);
                if (userResultNum !== q.result) {
                    isCorrect = false;
                    errorMsg = "Jawapan akhir belum tepat.";
                }

                if (isCorrect) {
                    playCorrectSound();
                    gameState.score += 10;
                    gameState.streak++;
                    if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;
                    gameState.correctCount++;
                    checkRewards();
                    const rewardText = showCorrectReward();
                    saveGame();

                    showModal("BETUL! 🎉", "Hebat! Pengiraan anda tepat sekali.<br><br>" + rewardText, "⭐", "Seterusnya", () => {
                        currentQuestionIdx++;
                        if (currentQuestionIdx >= questionLimit) {
                            renderStageComplete();
                        } else {
                            activeQuestionData = generateQuestionForYear(currentOperation, currentYear, currentLevel, currentQuestionIdx);
                            renderQuestionView();
                        }
                    });
                } else {
                    playWrongSound();
                    registerWrongAnswer(errorMsg + "<br><br><b>Semak semula pengiraan anda.</b>");
                }
                return;
            }

            if (q.year === 1 && q.level === 2 && q.op === 'tambah' && currentQuestionIdx >= 5) {
                let ansPuluhElem = document.getElementById('ans-puluh');
                let ansSaElem = document.getElementById('ans-sa');
                let ansPuluh = ansPuluhElem ? ansPuluhElem.value : '';
                let ansSa = ansSaElem ? ansSaElem.value : '';

                if (ansPuluh === '' || ansSa === '') {
                    showModal("Belum Lengkap", "Sila isi semua kotak jawapan Puluh dan Sa.", "⚠️", "OK");
                    return;
                }

                let userResultNum = parseInt(ansPuluh + ansSa, 10);
                if (userResultNum !== q.result) {
                    isCorrect = false;
                    errorMsg = "Jawapan bentuk lazim belum tepat.";
                }

                if (isCorrect) {
                    playCorrectSound();
                    gameState.score += 10;
                    gameState.streak++;
                    if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;
                    gameState.correctCount++;
                    checkRewards();
                    const rewardText = showCorrectReward();
                    saveGame();

                    showModal("BETUL! 🎉", "Hebat! Pengiraan anda tepat sekali.<br><br>" + rewardText, "⭐", "Seterusnya", () => {
                        currentQuestionIdx++;
                        if (currentQuestionIdx >= questionLimit) {
                            renderStageComplete();
                        } else {
                            activeQuestionData = generateQuestionForYear(currentOperation, currentYear, currentLevel, currentQuestionIdx);
                            renderQuestionView();
                        }
                    });
                } else {
                    playWrongSound();
                    registerWrongAnswer(errorMsg + "<br><br><b>Semak semula pengiraan anda.</b>");
                }
                return;
            }

            if (q.year === 1 && q.level === 2 && q.op === 'tolak' && currentQuestionIdx < 5) {
                const ansSaElem = document.getElementById('ans-sa');
                const ansSa = ansSaElem ? ansSaElem.value : '';
                if (ansSa === '') {
                    showModal("Belum Lengkap", "Sila isi kotak jawapan SA.", "⚠️", "OK");
                    return;
                }
                if (parseInt(ansSa, 10) !== q.result) {
                    isCorrect = false;
                    errorMsg = "Jawapan akhir belum tepat.";
                }
                if (isCorrect) {
                    playCorrectSound();
                    gameState.score += 10;
                    gameState.streak++;
                    if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;
                    gameState.correctCount++;
                    checkRewards();
                    const rewardText = showCorrectReward();
                    saveGame();
                    showModal("BETUL! 🎉", "Hebat! Pengiraan anda tepat sekali.<br><br>" + rewardText, "⭐", "Seterusnya", () => {
                        currentQuestionIdx++;
                        if (currentQuestionIdx >= questionLimit) renderStageComplete();
                        else {
                            activeQuestionData = generateQuestionForYear(currentOperation, currentYear, currentLevel, currentQuestionIdx);
                            renderQuestionView();
                        }
                    });
                } else {
                    playWrongSound();
                    registerWrongAnswer(errorMsg + "<br><br><b>Semak semula pengiraan anda.</b>");
                }
                return;
            }

            // TAHUN 1: Aras 2 (soalan 6-10) & Aras 3.
            // Kedua-duanya hanya menggunakan nilai tempat PULUH dan SA.
            // Jangan jatuhkan semakan ke blok umum kerana blok umum memerlukan
            // ans-ratus/ans-ribu yang memang tidak wujud untuk Tahun 1.
            if (q.year === 1 && ((q.level === 2 && currentQuestionIdx >= 5) || q.level === 3)) {
                const ansPuluhElem = document.getElementById('ans-puluh');
                const ansSaElem = document.getElementById('ans-sa');
                const ansPuluh = ansPuluhElem ? ansPuluhElem.value : '';
                const ansSa = ansSaElem ? ansSaElem.value : '';

                // Tahun 1 Aras 3: semak nilai jawapan berdasarkan nilai tempat sebenar.
                // Kotak PULUH yang kosong dianggap 0 supaya jawapan satu digit (contoh 52 - 47 = 5)
                // tetap diterima. Untuk jawapan dua digit, kedua-dua PULUH dan SA mesti diisi.
                const expectedResult = Number(q.result);
                if (ansSa === '' || (expectedResult >= 10 && ansPuluh === '')) {
                    showModal("Belum Lengkap", "Sila isi kotak jawapan yang diperlukan.", "⚠️", "OK");
                    return;
                }

                const userPuluh = ansPuluh === '' ? 0 : Number(ansPuluh);
                const userSa = Number(ansSa);
                const userResultNum = userPuluh * 10 + userSa;
                if (userResultNum !== expectedResult) {
                    playWrongSound();
                    registerWrongAnswer("Jawapan akhir bentuk lazim belum tepat.<br><br><b>Semak semula pengiraan anda.</b>");
                    return;
                }

                playCorrectSound();
                gameState.score += 10;
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;
                gameState.correctCount++;
                checkRewards();
                const rewardText = showCorrectReward();
                saveGame();

                showModal("BETUL! 🎉", "Hebat! Pengiraan anda tepat sekali.<br><br>" + rewardText, "⭐", "Seterusnya", () => {
                    currentQuestionIdx++;
                    if (currentQuestionIdx >= questionLimit) {
                        renderStageComplete();
                    } else {
                        activeQuestionData = generateQuestionForYear(currentOperation, currentYear, currentLevel, currentQuestionIdx);
                        renderQuestionView();
                    }
                });
                return;
            }

            if (q.year === 2 && q.op === 'tambah') {
                let sumU = (q.a % 10) + (q.b % 10) + (q.numCount === 3 ? (q.c % 10) : 0);
                let cPuluhVal = Math.floor(sumU / 10);
                
                let sumD = Math.floor((q.a % 100) / 10) + Math.floor((q.b % 100) / 10) + (q.numCount === 3 ? Math.floor((q.c % 100) / 10) : 0) + cPuluhVal;
                let cRatusVal = Math.floor(sumD / 10);

                if (cPuluhVal > 0) {
                    let carryPuluhElem = document.getElementById('carry-puluh');
                    let carryPuluh = parseInt(carryPuluhElem ? carryPuluhElem.value || '0' : '0', 10);
                    if (carryPuluh !== cPuluhVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula (carry) pada nilai tempat Puluh belum tepat!";
                    }
                }
                if (cRatusVal > 0) {
                    let carryRatusElem = document.getElementById('carry-ratus');
                    let carryRatus = parseInt(carryRatusElem ? carryRatusElem.value || '0' : '0', 10);
                    if (carryRatus !== cRatusVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula pada Ratus belum tepat!";
                    }
                }
                let sumH = Math.floor((q.a % 1000) / 100) + Math.floor((q.b % 1000) / 100) + (q.numCount === 3 ? Math.floor((q.c % 1000) / 100) : 0) + cRatusVal;
                let cRibuVal = Math.floor(sumH / 10);
                if (cRibuVal > 0) {
                    let carryRibuElem = document.getElementById('carry-ribu');
                    let carryRibu = parseInt(carryRibuElem ? carryRibuElem.value || '0' : '0', 10);
                    if (carryRibu !== cRibuVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula pada Ribu belum tepat!";
                    }
                }
            } else if (q.year === 3 && q.op === 'tambah') {
                let sumU = (q.a % 10) + (q.b % 10) + (q.numCount === 3 ? (q.c % 10) : 0);
                let cPuluhVal = Math.floor(sumU / 10);
                
                let sumD = Math.floor((q.a % 100) / 10) + Math.floor((q.b % 100) / 10) + (q.numCount === 3 ? Math.floor((q.c % 100) / 10) : 0) + cPuluhVal;
                let cRatusVal = Math.floor(sumD / 10);
                
                let sumH = Math.floor((q.a % 1000) / 100) + Math.floor((q.b % 1000) / 100) + (q.numCount === 3 ? Math.floor((q.c % 1000) / 100) : 0) + cRatusVal;
                let cRibuVal = Math.floor(sumH / 10);

                let sumTh = Math.floor(q.a / 1000) + Math.floor(q.b / 1000) + (q.numCount === 3 ? Math.floor(q.c / 1000) : 0) + cRibuVal;
                let cPuluhRibuVal = Math.floor(sumTh / 10);

                if (cPuluhVal > 0) {
                    let carryPuluhElem = document.getElementById('carry-puluh');
                    let carryPuluh = parseInt(carryPuluhElem ? carryPuluhElem.value || '0' : '0', 10);
                    if (carryPuluh !== cPuluhVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula (carry) pada nilai tempat Puluh belum tepat!";
                    }
                }
                if (cRatusVal > 0) {
                    let carryRatusElem = document.getElementById('carry-ratus');
                    let carryRatus = parseInt(carryRatusElem ? carryRatusElem.value || '0' : '0', 10);
                    if (carryRatus !== cRatusVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula pada Ratus belum tepat!";
                    }
                }
                if (cRibuVal > 0) {
                    let carryRibuElem = document.getElementById('carry-ribu');
                    let carryRibu = parseInt(carryRibuElem ? carryRibuElem.value || '0' : '0', 10);
                    if (carryRibu !== cRibuVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula pada Ribu belum tepat!";
                    }
                }
                if (cPuluhRibuVal > 0) {
                    let carryPBUElem = document.getElementById('carry-puluhribu');
                    let carryPBU = parseInt(carryPBUElem ? carryPBUElem.value || '0' : '0', 10);
                    if (carryPBU !== cPuluhRibuVal) {
                        isCorrect = false;
                        errorMsg = "Proses pengumpulan semula pada Puluh Ribu belum tepat!";
                    }
                }
            } else if (q.op === 'tolak' && q.needsCarry) {
                let uA = q.a % 10;
                let uB = q.b % 10;
                if (uA < uB) {
                    let bInSa = document.getElementById('borrow-in-sa');
                    if (!bInSa || bInSa.value !== '10') {
                        isCorrect = false;
                        errorMsg = "❌ Sila masukkan 10 di ruang pinjaman SA.";
                    }
                }
            }

            let ansSa = document.getElementById('ans-sa').value;
            let ansPuluh = document.getElementById('ans-puluh').value;
            let ansRatus = document.getElementById('ans-ratus').value;
            let ansRibu = (q.year === 2 || q.year === 3) ? (document.getElementById('ans-ribu')?.value || '') : '';
            let ansPuluhRibu = q.year === 3 ? (document.getElementById('ans-puluhribu')?.value || '') : '';

            if (isCorrect) {
                if (q.year === 2) {
                    // RIBU Tahun 2 ialah lajur nilai tempat tambahan; kosong = 0 untuk jawapan < 1000.
                    const ribuWajib = q.result >= 1000;
                    if (ansSa === '' || ansPuluh === '' || ansRatus === '' || (ribuWajib && ansRibu === '')) {
                        showModal("Belum Lengkap", "Sila isi semua kotak jawapan yang diperlukan. Jika jawapan kurang daripada 1000, kotak Ribu boleh dibiarkan kosong.", "⚠️", "OK");
                        return;
                    }
                } else if (
                    ansSa === '' ||
                    ansPuluh === '' ||
                    ansRatus === '' ||
                    (q.year === 3 && ansRibu === '') ||
                    (q.year === 3 && q.result >= 10000 && ansPuluhRibu === '')
                ) {
                    showModal("Belum Lengkap", "Sila isi semua kotak jawapan yang diperlukan.", "⚠️", "OK");
                    return;
                }
            }

            if (isCorrect) {
                let userResultNum;

                // TAHUN 3 TOLAK: semak terus berdasarkan empat nilai tempat sebenar.
                // P.RIBU hanyalah ruang tambahan dan 0 di situ tidak boleh menyebabkan
                // jawapan 4 digit yang sah (contoh 02148 = 2148) dianggap salah.
                if (q.year === 3 && q.op === 'tolak') {
                    const dPuluhribu = Number(ansPuluhRibu || 0);
                    const dRibu = Number(ansRibu || 0);
                    const dRatus = Number(ansRatus || 0);
                    const dPuluh = Number(ansPuluh || 0);
                    const dSa = Number(ansSa || 0);
                    userResultNum = dPuluhribu * 10000 + dRibu * 1000 + dRatus * 100 + dPuluh * 10 + dSa;
                    const expectedResult = Number(q.a) - Number(q.b);

                    if (userResultNum !== expectedResult) {
                        isCorrect = false;
                        errorMsg = "Nilai angka jawapan akhir bentuk lazim belum tepat.";
                    }
                } else {
                    let userResultStr = q.year === 3 ? (ansPuluhRibu + ansRibu + ansRatus + ansPuluh + ansSa) : (q.year === 2 ? (ansRibu + ansRatus + ansPuluh + ansSa) : (ansRatus + ansPuluh + ansSa));
                    userResultNum = parseInt(userResultStr, 10);

                    if (userResultNum !== q.result) {
                        isCorrect = false;
                        errorMsg = "Nilai angka jawapan akhir bentuk lazim belum tepat.";
                    }
                }
            }

            if (isCorrect) {
                playCorrectSound();
                gameState.score += 10;
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;
                gameState.correctCount++;
                checkRewards();
                const rewardText = showCorrectReward();
                saveGame();

                showModal("BETUL! 🎉", "Hebat! Pengiraan bentuk lazim dan langkah pinjaman anda tepat sekali.<br><br>" + rewardText, "⭐", "Seterusnya", () => {
                    currentQuestionIdx++;
                    if (currentQuestionIdx >= questionLimit) {
                        renderStageComplete();
                    } else {
                        activeQuestionData = generateQuestionForYear(currentOperation, currentYear, currentLevel, currentQuestionIdx);
                        renderQuestionView();
                    }
                });
            } else {
                playWrongSound();
                registerWrongAnswer(errorMsg + "<br><br><b>Semak semula langkah pengiraan anda.</b>");
            }
        }

        function renderWiraRewardCard(tier, currentLevel) {
            const unlocked = currentLevel >= tier.min;
            const current = currentLevel >= tier.min && currentLevel <= tier.max;
            const rangeText = tier.min === tier.max ? `LEVEL ${tier.min}` : `LEVEL ${tier.min}–${tier.max}`;
            return `
                <div class="p-2.5 rounded-2xl border flex items-center justify-between shadow ${unlocked ? 'bg-amber-950/40 border-amber-500/50 text-amber-200' : 'bg-slate-950/40 border-slate-800 text-slate-500'} ${current ? 'ring-2 ring-cyan-400/60' : ''}">
                    <div class="flex items-center gap-2">
                        <div class="text-2xl ${unlocked ? '' : 'grayscale opacity-40'} ${tier.min >= 20 ? 'wira-future-blink' : ''}">${tier.emblem}</div>
                        <div>
                            <h4 class="font-display font-bold text-xs ${unlocked ? 'text-white' : 'text-slate-500'} ${tier.min >= 20 ? 'wira-future-blink' : ''}">${tier.title}</h4>
                            <p class="text-[10px]">${rangeText}${current ? ' • SEDANG AKTIF' : ''}</p>
                        </div>
                    </div>
                    <span class="font-bold text-[11px]">${unlocked ? '✅ Diperoleh' : '🔒 Terkunci'}</span>
                </div>
            `;
        }

        function renderRewardCard(title, desc, unlocked) {
            return `
                <div class="p-2.5 rounded-2xl border flex items-center justify-between shadow ${unlocked ? 'bg-amber-950/40 border-amber-500/50 text-amber-200' : 'bg-slate-950/40 border-slate-800 text-slate-500'}">
                    <div>
                        <h4 class="font-display font-bold text-xs text-white">${title}</h4>
                        <p class="text-[10px]">${desc}</p>
                    </div>
                    <span class="font-bold text-[11px]">${unlocked ? '✅ Diperoleh' : '🔒 Terkunci'}</span>
                </div>
            `;
        }

        function formatCertificateDate(iso) {
            try { return new Date(iso).toLocaleString('ms-MY', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
            catch(e) { return iso || '-'; }
        }

        function operationLabel(op) {
            return op === 'tambah' ? '➕ TAMBAH' : op === 'tolak' ? '➖ TOLAK' : '± CAMPURAN';
        }

        function saveMissionCertificate() {
            stopMissionTimer();
            ensureProgressState();
            const earnedScore = Math.max(0, (Number(gameState.score)||0) - missionStartScore);
            const correct = Math.max(0, (Number(gameState.correctCount)||0) - missionStartCorrect);
            const wrong = Math.max(0, (Number(gameState.wrongCount)||0) - missionStartWrong);
            const total = correct + wrong;
            const accuracy = total ? Math.round((correct / total) * 100) : 0;
            const cert = {
                id: 'MW-' + Date.now() + '-' + Math.random().toString(36).slice(2,7).toUpperCase(),
                year: Number(currentYear),
                operation: currentOperation,
                level: Number(currentLevel),
                score: earnedScore,
                correct,
                wrong,
                totalQuestions: questionLimit,
                accuracy,
                streakAtEnd: Number(gameState.streak)||0,
                missionTimeSeconds: Number(missionElapsedSeconds)||0,
                studentName: String(gameState.studentProfile?.name || ''),
                studentClass: String(gameState.studentProfile?.className || ''),
                date: new Date().toISOString()
            };
            gameState.certificates = Array.isArray(gameState.certificates) ? gameState.certificates : [];
            gameState.certificates.unshift(cert);
            // Simpan semua sijil yang munasabah untuk rekod murid; elak localStorage terlalu besar.
            if (gameState.certificates.length > 100) gameState.certificates = gameState.certificates.slice(0,100);

            const key = String(currentYear);
            const old = gameState.bestByYear[key];
            if (!old || earnedScore > Number(old.score||0) || (earnedScore === Number(old.score||0) && accuracy > Number(old.accuracy||0))) {
                gameState.bestByYear[key] = { ...cert };
            }
            saveGame();
            return cert;
        }

        function getCertificate(id) {
            ensureProgressState();
            return gameState.certificates.find(c => c.id === id) || null;
        }

        function certificateHtml(c) {
            const grade = c.accuracy >= 90 ? 'CEMERLANG' : c.accuracy >= 70 ? 'BAIK' : c.accuracy >= 50 ? 'MEMUASKAN' : 'TERUSKAN USAHA';
            // LEVEL SEMASA: ambil level terkini yang tersimpan ketika sijil dibuka.
            // Rekod ARAS misi (c.level) kekal sebagai sejarah misi.
            ensureProgressState();
            const liveLevel = Math.max(1, Number(gameState.level) || 1);
            const liveTitle = getWiraTitle(liveLevel);
            return `
            <div class="certificate-paper">
                <div class="cert-border">
                    <div class="cert-top">✨ MISI WIRA MATEMATIK ✨</div>
                    <div class="cert-title">SIJIL PENCAPAIAN DIGITAL</div>
                    <div class="cert-sub">Dengan sukacitanya direkodkan bahawa</div>
                    <div class="cert-name">${escapeHtml(c.studentName || 'WIRA MATEMATIK')}</div>
                    ${c.studentClass ? `<div class="cert-sub" style="font-weight:700;margin-top:-2px">Kelas: ${escapeHtml(c.studentClass)}</div>` : ''}
                    <div class="cert-sub">telah berjaya menyelesaikan misi</div>
                    <div class="cert-mission">TAHUN ${c.year} • ${operationLabel(c.operation)} • ARAS ${c.level}</div>
                    <div class="cert-current-level">⭐ LEVEL SEMASA: ${liveLevel} • ${liveTitle.emblem} ${liveTitle.title}</div>
                    <div class="cert-grid">
                        <div><span>⭐ SKOR</span><b>${c.score}</b></div>
                        <div><span>🎯 KETEPATAN</span><b>${c.accuracy}%</b></div>
                        <div><span>✅ BETUL</span><b>${c.correct}</b></div>
                        <div><span>🔥 STREAK</span><b>${c.streakAtEnd}</b></div>
                        <div><span>⏱️ MASA</span><b>${formatMissionTime(c.missionTimeSeconds || 0)}</b></div>
                    </div>
                    <div class="cert-grade">${grade}</div>
                    <div class="cert-date">Tarikh: ${formatCertificateDate(c.date)}<br>No. Sijil: ${c.id}</div>
                    <div class="cert-footer">🏆 Simpan dalam Rekod Prestasi • Boleh dicetak & dikongsi</div>
                </div>
            </div>`;
        }

        function certificateCss() {
            return `<style>
                .certificate-paper{background:#fff;color:#172033;width:min(100%,760px);aspect-ratio:1.414/1;padding:10px;box-sizing:border-box;border-radius:18px;box-shadow:0 15px 45px rgba(0,0,0,.35);font-family:Georgia,'Times New Roman',serif}
                .cert-border{height:100%;border:5px double #d4a72c;padding:28px 34px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;justify-content:center;position:relative}
                .cert-top{font-size:16px;font-weight:900;letter-spacing:3px;color:#8a6414}.cert-title{font-size:23px;font-weight:900;letter-spacing:1px;line-height:1.15;margin:8px 0;color:#172033}.cert-sub{font-size:14px;margin:5px 0;color:#4b5563}.cert-name{font-size:27px;font-weight:900;color:#0f4c81;margin:8px 0}.cert-mission{font-size:17px;font-weight:900;margin:8px 0 10px;color:#243b53}.cert-current-level{font-size:14px;font-weight:900;letter-spacing:.5px;margin:0 auto 12px;padding:7px 14px;border:2px solid #d4a72c;border-radius:999px;color:#8a6414;background:#fff8dc;display:inline-block}.cert-grid{display:grid;grid-template-columns:.9fr 1.3fr .9fr .9fr;gap:6px;margin:0 auto 12px;width:92%}.cert-grid div{border:1px solid #d8dee8;border-radius:10px;padding:7px 3px;min-width:0;box-sizing:border-box;text-align:center;overflow:hidden}.cert-grid span{display:block;font-size:6.5px;color:#64748b;font-weight:800;white-space:nowrap;line-height:1.05;min-height:15px;overflow:hidden;text-overflow:clip;letter-spacing:-0.1px}.cert-grid b{display:block;font-size:17px;line-height:1.05;margin-top:3px;white-space:nowrap}.cert-grid div:last-child{grid-column:2 / span 2}.cert-grade{font-size:18px;font-weight:900;letter-spacing:2px;color:#b7791f}.cert-date{font-size:10px;color:#64748b;margin-top:10px}.cert-footer{font-size:9px;color:#94a3b8;margin-top:12px}
                @media print{body *{visibility:hidden!important}.certificate-paper,.certificate-paper *{visibility:visible!important}.certificate-paper{position:absolute;left:0;top:0;width:100vw;height:100vh;box-shadow:none;border-radius:0;padding:0}.cert-border{border-width:5px;border-radius:0}}
            </style>`;
        }

        function openCertificate(id) {
            const c = getCertificate(id);
            if (!c) return;
            toggleHeader(false);
            const view = document.getElementById('app-view');
            view.innerHTML = `${certificateCss()}<div class="flex flex-col h-full pop-animation">
                <div class="flex items-center justify-between mb-2 gap-2">
                    <div><h2 class="font-display text-sm sm:text-base font-bold text-white">📜 Sijil Pencapaian</h2><p class="text-[9px] text-cyan-200">${c.id}</p></div>
                    <button onclick="openStats()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-2 rounded-xl font-bold">↩ PRESTASI</button>
                </div>
                <div class="flex-1 overflow-y-auto flex flex-col items-center gap-3 pb-2">
                    ${certificateHtml(c)}
                    <div class="grid grid-cols-3 gap-2 w-full max-w-md">
                        <button onclick="printCertificate('${c.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-bold">🖨️ PRINT / PDF</button>
                        <button onclick="shareCertificate('${c.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-bold">📤 SHARE</button>
                        <button onclick="openStats()" class="bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-xl text-xs font-bold">📊 REKOD</button>
                    </div>
                </div>
            </div>`;
        }

        function printCertificate(id) {
            const c = getCertificate(id);
            if (!c) return;
            const w = window.open('', '_blank', 'width=1000,height=760');
            if (!w) { showModal('Popup disekat', 'Benarkan popup untuk mencetak sijil.', '🖨️', 'OK'); return; }
            w.document.write(`<!doctype html><html lang="ms"><head><meta charset="utf-8"><title>${c.id}</title>${certificateCss()}</head><body style="margin:0;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh">${certificateHtml(c)}<script>window.onload=function(){setTimeout(function(){window.print()},300)};<\/script></body></html>`);
            w.document.close();
        }

        async function shareCertificate(id) {
            const c = getCertificate(id);
            if (!c) return;
            ensureProgressState();
            const liveLevel = Math.max(1, Number(gameState.level) || 1);
            const liveTitle = getWiraTitle(liveLevel);
            const text = `📜 SIJIL PENCAPAIAN DIGITAL\n\nMISI WIRA MATEMATIK\nMurid: ${c.studentName || 'WIRA MATEMATIK'}${c.studentClass ? `\nKelas: ${c.studentClass}` : ''}\nTahun ${c.year} • ${operationLabel(c.operation)} • Aras ${c.level}\n⭐ LEVEL SEMASA: ${liveLevel} • ${liveTitle.title}\n⭐ Skor: ${c.score}\n🎯 Ketepatan: ${c.accuracy}%\n✅ Betul: ${c.correct}\n🔥 Streak: ${c.streakAtEnd}\n⏱️ Masa: ${formatMissionTime(c.missionTimeSeconds || 0)}\n📅 ${formatCertificateDate(c.date)}\n🔖 ${c.id}`;
            try {
                if (navigator.share) {
                    await navigator.share({ title:'Sijil Pencapaian Digital', text });
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                    showModal('Sedia Dikongsi 📤', 'Maklumat sijil telah disalin. Boleh tampal ke WhatsApp / Telegram.', '📤', 'OK');
                } else {
                    showModal('Sijil Pencapaian', text.replace(/\n/g,'<br>'), '📜', 'OK');
                }
            } catch(e) {}
        }

        function openStats() {
            toggleHeader(false);
            ensureProgressState();
            const view = document.getElementById('app-view');
            const certs = gameState.certificates || [];
            const bests = [1,2,3].map(y => gameState.bestByYear[String(y)] || null);
            const activityCount = certs.length;
            view.innerHTML = `
                <div class="flex flex-col h-full pop-animation">
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <div><h2 class="font-display text-sm sm:text-base font-bold text-white">📊 PRESTASI WIRA</h2><p class="text-[9px] text-cyan-200">Pusat Rekod Pencapaian & Aktiviti</p></div>
                        <button onclick="renderMainMenu()" class="bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 text-white text-xs px-3 py-2 rounded-xl font-extrabold">🏠 Menu</button>
                    </div>
                    <div class="space-y-2.5 flex-1 overflow-y-auto pr-1 text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-indigo-500/30 text-center"><span class="block text-slate-400 text-[10px]">⭐ Skor Keseluruhan</span><p class="text-base text-accent">${gameState.score}</p></div>
                            <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-indigo-500/30 text-center"><span class="block text-slate-400 text-[10px]">🎯 Aktiviti Selesai</span><p class="text-base text-cyan-300">${activityCount}</p></div>
                            <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-indigo-500/30 text-center"><span class="block text-slate-400 text-[10px]">🔥 Streak Tertinggi</span><p class="text-base text-orange-400">${gameState.maxStreak}</p></div>
                            <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-indigo-500/30 text-center"><span class="block text-slate-400 text-[10px]">📜 Jumlah Sijil</span><p class="text-base text-amber-300">${certs.length}</p></div>
                        </div>

                        <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-amber-500/30">
                            <div class="flex items-center justify-between mb-2"><h3 class="font-display font-bold text-white">🏆 REKOD TERBAIK MENGIKUT TAHUN</h3><span class="text-[9px] text-slate-400">Tekan rekod untuk buka sijil</span></div>
                            <div class="space-y-2">
                                ${bests.map((c,i)=>c ? `<button onclick="openCertificate('${c.id}')" class="w-full text-left bg-gradient-to-r from-amber-950/50 to-slate-900 border border-amber-500/30 rounded-xl p-2.5 flex items-center gap-2 hover:border-amber-300 transition"><span class="text-xl">🏆</span><span class="flex-1"><b class="text-white block">TAHUN ${i+1} • ${operationLabel(c.operation)}</b><span class="text-[10px] text-slate-400">Aras ${c.level} • ${c.accuracy}% • ${formatCertificateDate(c.date)}</span></span><strong class="text-amber-300">⭐ ${c.score}</strong></button>` : `<div class="bg-slate-900/50 border border-slate-800 rounded-xl p-2.5 text-slate-500">🎮 Tahun ${i+1} — belum ada rekod terbaik</div>`).join('')}
                            </div>
                        </div>

                        <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-cyan-500/30">
                            <div class="flex items-center justify-between mb-2"><h3 class="font-display font-bold text-white">📜 SIJIL PENCAPAIAN</h3><span class="text-[9px] text-slate-400">${certs.length} rekod</span></div>
                            <div class="space-y-1.5">
                                ${certs.length ? certs.map(c=>`<button onclick="openCertificate('${c.id}')" class="w-full text-left bg-slate-900/70 border border-indigo-500/20 rounded-xl p-2 flex items-center gap-2 hover:border-cyan-400/50 transition"><span class="text-lg">📜</span><span class="flex-1"><b class="text-white block text-[11px]">Tahun ${c.year} • ${operationLabel(c.operation)}</b><span class="text-[9px] text-slate-400">Aras ${c.level} • ${c.accuracy}% • ${formatCertificateDate(c.date)}</span></span><span class="text-amber-300 font-bold">⭐${c.score}</span></button>`).join('') : `<div class="text-center text-slate-500 py-4">Belum ada sijil. Selesaikan satu misi untuk mendapat sijil. 🏆</div>`}
                            </div>
                        </div>

                        <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-emerald-500/30">
                            <h3 class="font-display font-bold text-white mb-1">🎯 AKTIVITI</h3>
                            <p class="text-[10px] text-slate-400">Setiap misi yang berjaya diselesaikan direkodkan di sini dan sijilnya boleh dibuka semula pada bila-bila masa.</p>
                        </div>
                    </div>
                </div>`;
        }

        function resetData() {
            showModal("Tetapkan Semula?", "Adakah anda pasti mahu memadam semua rekod dan skor?", "⚠️", "Ya, Reset", () => {
                localStorage.removeItem(SAVE_KEY);
                gameState = { score: 0, streak: 0, maxStreak: 0, correctCount: 0, wrongCount: 0, lives: 3, coins: 0, xp: 0, level: 1, progressByYear: { 1: defaultYearProgress(), 2: defaultYearProgress(), 3: defaultYearProgress() }, certificates: [], bestByYear: {}, soundEnabled: true, achievements: { firstMission: false, streak5: false, correct10: false, levelUp: false }, rewards: { pejuangTambah: false, masterCarry: false, wiraMatematik: false, masterLazim: false } };
                renderMainMenu();
            });
        }

        window.onload = function() {
            loadGame();
            renderMainMenu();
        };
    </script>
</body>
</html>
